<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>粉体设备高级预选型 - 极简开关版</title>
<style>
  :root {
    --bg: #0f0f11; --surface: #1a1a1e; --text-main: #f2f2f5; --text-sub: #8b8b93;
    --line: #2a2a30; --accent: #2979ff; --accent-glow: rgba(41, 121, 255, 0.3);
    --danger: #ff5252;
    
    --shadow-out: 4px 4px 10px rgba(0,0,0,0.4), -2px -2px 6px rgba(255,255,255,0.03);
    --shadow-in: inset 4px 4px 10px rgba(0,0,0,0.6), inset -2px -2px 6px rgba(255,255,255,0.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background-color: var(--bg); color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased; padding: 24px 16px 60px;
  }

  .wrap { max-width: 520px; margin: 0 auto; }

  .header { margin-bottom: 24px; padding: 0 4px; }
  .header h1 { 
    font-size: 28px; font-weight: 900; letter-spacing: -0.04em; color: #fff;
    display: flex; align-items: center; gap: 10px;
  }
  .header h1::before { content: ''; display: block; width: 6px; height: 22px; background: var(--accent); border-radius: 3px; }

  .card {
    background: var(--surface); border-radius: 20px;
    box-shadow: var(--shadow-out); border: 1px solid rgba(255, 255, 255, 0.04);
    margin-bottom: 20px; overflow: hidden; position: relative;
  }

  .card-head { padding: 18px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
  .card-title-wrap { display: flex; align-items: center; gap: 8px; }
  .card-num { font-size: 12px; font-weight: 800; color: var(--accent); background: rgba(41, 121, 255, 0.15); padding: 2px 8px; border-radius: 6px; }
  .card-title { font-size: 16px; font-weight: 700; color: var(--text-main); }

  .card-body { padding: 10px 20px 20px; }

  /* 基础输入框 */
  .input-group { margin-bottom: 16px; }
  .input-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-sub); margin-bottom: 8px; }
  .input-field {
    width: 100%; background: var(--bg); border: none; border-radius: 12px;
    padding: 16px; color: var(--text-main); font-family: inherit; font-size: 16px; font-weight: 500;
    box-shadow: var(--shadow-in); outline: none; border: 1px solid transparent; transition: border 0.2s;
  }
  .input-field:focus { border: 1px solid var(--accent); box-shadow: var(--shadow-in), 0 0 0 3px var(--accent-glow); }
  select.input-field {
    -webkit-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238b8b93%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 12px auto;
  }

  /* 滑块与数字输入 */
  .slider-container { margin-bottom: 24px; }
  .slider-container:last-child { margin-bottom: 0; }
  
  .slider-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
  .slider-label { font-size: 13px; font-weight: 600; color: var(--text-sub); }
  .slider-value-wrap { text-align: right; position: relative; }
  
  .slider-value { 
    font-size: 28px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; 
    transition: color 0.1s; cursor: pointer;
    border-bottom: 1px dashed rgba(255,255,255,0.2);
    padding-bottom: 2px;
  }
  .slider-value:hover { border-bottom-color: var(--accent); }
  
  .inline-input {
    font-size: 28px; font-weight: 900; line-height: 1;
    background: rgba(41, 121, 255, 0.1); border: 1px solid var(--accent);
    color: #fff; width: 110px; text-align: right; outline: none;
    border-radius: 8px; padding: 0 4px;
    font-family: inherit; -webkit-appearance: none;
  }
  
  .slider-unit { font-size: 14px; color: var(--text-sub); font-weight: 600; margin-left: 2px; }

  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 8px 0; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%; height: 12px; cursor: pointer;
    background: var(--bg); border-radius: 6px; box-shadow: var(--shadow-in); border: 1px solid rgba(255,255,255,0.02);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 28px; width: 28px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--accent);
    margin-top: -9px; cursor: pointer; box-shadow: 2px 2px 6px rgba(0,0,0,0.5), -1px -1px 4px rgba(255,255,255,0.1);
    transition: transform 0.1s, border-color 0.2s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.15); background: var(--surface-hover); }

  .slider-ticks { display: flex; justify-content: space-between; font-size: 11px; color: #55555c; font-weight: 600; margin-top: 4px; padding: 0 4px; }

  .unit-switch { display: flex; background: var(--bg); border-radius: 8px; padding: 2px; box-shadow: var(--shadow-in); border: 1px solid rgba(255,255,255,0.02); }
  .unit-switch button {
    padding: 4px 12px; border: none; background: transparent; font-size: 12px; font-weight: 700;
    color: var(--text-sub); border-radius: 6px; cursor: pointer; transition: all 0.2s;
  }
  .unit-switch button.on { background: var(--surface-hover); color: #fff; box-shadow: 1px 1px 3px rgba(0,0,0,0.5); }

  .btn-primary {
    display: block; width: 100%; padding: 18px; border-radius: 16px;
    background: var(--accent); color: #fff; border: none; font-family: inherit; font-size: 18px; font-weight: 800;
    cursor: pointer; box-shadow: 0 6px 20px var(--accent-glow), inset 0 2px 0 rgba(255,255,255,0.2);
    transition: all 0.1s; margin-bottom: 32px;
  }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 10px var(--accent-glow); }

  /* =========================================
     新设计：iOS 风格工艺开关列表
     ========================================= */
  .switch-list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  
  .switch-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.1s;
  }
  .switch-row:last-child { border-bottom: none; }
  .switch-row:active { background: rgba(255,255,255,0.03); }

  .switch-label {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-main);
    transition: color 0.2s;
  }

  /* iOS 开关轨道 */
  .switch-track {
    width: 44px;
    height: 24px;
    border-radius: 24px;
    background: #333;
    position: relative;
    transition: background 0.3s ease;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
  }

  /* iOS 开关滑块 */
  .switch-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    position: absolute;
    top: 2px;
    left: 2px;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.2s;
  }

  /* 开启状态 */
  .switch-row.on .switch-track {
    background: var(--accent);
  }
  .switch-row.on .switch-thumb {
    transform: translateX(20px);
  }
  .switch-row.on .switch-label {
    color: var(--accent);
    font-weight: 600;
  }

  /* 特殊：易燃易爆开启状态 */
  .switch-row[data-k="ex"].on .switch-track {
    background: var(--danger);
  }
  .switch-row[data-k="ex"].on .switch-label {
    color: var(--danger);
  }

  /* =========================================
     结果区与评分 UI
     ========================================= */
  .res-header { font-size: 18px; font-weight: 800; color: #fff; margin: 24px 4px 12px; }
  
  .result-tag {
    position: absolute; top: 16px; right: 16px;
    padding: 4px 12px; border-radius: 8px;
    font-size: 16px; font-weight: 900; 
    display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .tag-red { color: #ff3b30; border: 1px solid rgba(255,59,48,0.4); background: rgba(255,59,48,0.1); }
  .tag-yellow { color: #ffcc00; border: 1px solid rgba(255,204,0,0.4); background: rgba(255,204,0,0.1); }
  .tag-green { color: #34c759; border: 1px solid rgba(52,199,89,0.4); background: rgba(52,199,89,0.1); }

  .res-main-title { 
    font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 4px; 
    padding-right: 80px; word-break: break-all;
  }
  .res-sub-title { font-size: 14px; color: var(--text-sub); margin-bottom: 20px; }
  
  .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .res-item span { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 4px; }
  .res-item b { display: block; font-size: 15px; font-weight: 700; color: var(--text-main); }
  
  .res-warn { margin-top: 20px; padding: 16px; border-radius: 12px; background: rgba(255, 82, 82, 0.08); border: 1px solid rgba(255, 82, 82, 0.2); color: #ff8a80; font-size: 13px; line-height: 1.6; }
  .res-warn b { color: var(--danger); font-weight: 800; }
  .res-opt { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--text-sub); }
  .res-opt b { color: var(--text-main); font-weight: 700; }
  
  .empty-state { text-align: center; padding: 32px 0; }
  .empty-state h3 { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; color: var(--text-sub); }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>粉体预选型</h1>
  </div>

  <!-- 01 基础信息 -->
  <div class="card">
    <div class="card-head">
      <div class="card-title-wrap"><span class="card-num">01</span><span class="card-title">物料与产能</span></div>
    </div>
    <div class="card-body">
      <div class="input-group">
        <label class="input-label">物料名称（自动匹配）</label>
        <input id="mat" class="input-field" type="text" list="matList" placeholder="输入物料名称，如 石英..." autocomplete="off">
        <datalist id="matList"></datalist>
      </div>
      <div class="input-group">
        <label class="input-label">物料类别</label>
        <select id="cat" class="input-field">
          <option value="">请选择类别</option>
          <option value="mineral">非金属矿</option>
          <option value="hard">硬质矿物 / 高硅</option>
          <option value="battery">电池材料</option>
          <option value="pharma">医药 / 原料药</option>
          <option value="food">食品 / 保健品</option>
          <option value="chem">化工 / 颜料</option>
          <option value="herb">中药 / 植物纤维</option>
          <option value="metal">金属粉末</option>
          <option value="waste">固废 / 粉煤灰</option>
          <option value="other">其他</option>
        </select>
      </div>
      
      <!-- 产能滑块 -->
      <div class="slider-container">
        <div class="slider-header">
          <span class="slider-label">目标产能</span>
          <div class="slider-value-wrap">
            <span class="slider-value" id="capDisplay" style="color: var(--accent);">500</span>
            <span class="slider-unit">kg/h</span>
          </div>
        </div>
        <input type="range" id="capSlider" min="10" max="10000" step="10" value="500">
        <div class="slider-ticks"><span>10</span><span>2,500</span><span>5,000</span><span>10,000</span></div>
      </div>
    </div>
  </div>

  <!-- 02 粒度标准 -->
  <div class="card">
    <div class="card-head">
      <div class="card-title-wrap"><span class="card-num">02</span><span class="card-title">粒度标准</span></div>
      <div class="unit-switch" id="unitSwitch">
        <button class="on" data-u="um">µm</button>
        <button data-u="mesh">目</button>
      </div>
    </div>
    <div class="card-body">
      
      <!-- 粒度滑块 -->
      <div class="slider-container">
        <div class="slider-header">
          <span class="slider-label">目标粒度</span>
          <div class="slider-value-wrap">
            <span class="slider-value" id="sizeDisplay" style="color: var(--accent);">45</span>
            <span class="slider-unit" id="sizeUnitLabel">µm</span>
          </div>
        </div>
        <input type="range" id="sizeSlider" min="1" max="500" step="1" value="45">
        <div class="slider-ticks" id="sizeTicks"><span>1</span><span>100</span><span>300</span><span>500</span></div>
      </div>

      <div class="unit-switch" style="width: 100%; margin-top: 16px; padding: 4px;">
        <button style="flex:1" data-v="D50" class="on">D50</button>
        <button style="flex:1" data-v="D90">D90</button>
        <button style="flex:1" data-v="D97">D97</button>
        <button style="flex:1" data-v="D99">D99</button>
        <button style="flex:1" data-v="D100">D100</button>
      </div>
    </div>
  </div>

  <!-- 03 工艺属性 -->
  <div class="card">
    <div class="card-head">
      <div class="card-title-wrap"><span class="card-num">03</span><span class="card-title">物理与工艺属性</span></div>
    </div>
    <div class="card-body" style="padding-top: 0;">
      
      <!-- iOS 风格开关列表 -->
      <div class="switch-list" id="chips">
        <div class="switch-row" data-k="hard">
          <span class="switch-label">莫氏硬度高</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="quartz">
          <span class="switch-label">磨蚀性极强</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="wet">
          <span class="switch-label">含水率高</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="fib">
          <span class="switch-label">纤维 / 高韧性</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="sticky">
          <span class="switch-label">粘性易糊壁</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="static">
          <span class="switch-label">易起静电</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="flow">
          <span class="switch-label">流动性差</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="heat">
          <span class="switch-label">热敏 / 低熔点</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="oxidation">
          <span class="switch-label">易氧化</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="volatile">
          <span class="switch-label">易挥发</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="ex">
          <span class="switch-label" style="color: var(--danger);">易燃易爆</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="pure">
          <span class="switch-label">无金属污染</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
        <div class="switch-row" data-k="gmp">
          <span class="switch-label">医药食品级</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
      </div>

    </div>
  </div>

  <button class="btn-primary" id="go">执行智能评估</button>
  <div id="out"></div>

</div>

/* ============ 初始化 ============ */
const matListEl = document.getElementById('matList');
Object.keys(MATERIAL_DB).forEach(k => {
  const opt = document.createElement('option'); opt.value = k; matListEl.appendChild(opt);

const $ = id => document.getElementById(id);
const matEl = $('mat'), catEl = $('cat');

const sizeSlider = $('sizeSlider'), sizeDisplay = $('sizeDisplay');
const unitSwitch = $('unitSwitch'), sizeUnitLabel = $('sizeUnitLabel'), sizeTicks = $('sizeTicks');

let currentUnit = 'um';
let targetCap = 500;
let targetSizeUI = 45;
let actualSizeUm = 45;
let basis = 'D50'; 

/* ============ 动画与颜色逻辑 ============ */
function getDynamicColor(val, min, max) {
  let p = (val - min) / (max - min);
  let hue = 210 + p * 110;
  return `hsl(${hue}, 100%, 65%)`;
}

function animateNumber(el, targetVal, min, max) {
  const currentVal = parseFloat(el.innerText.replace(/,/g, '')) || 0;
  if (currentVal === targetVal) return;
  const duration = 200;
  const startTime = performance.now();
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    let progress = Math.min(elapsed / duration, 1);
    progress = progress * (2 - progress); 
    const current = currentVal + (targetVal - currentVal) * progress;
    
    let displayStr = targetVal > 1000 ? Math.round(current).toLocaleString() : Math.round(current);
    if (targetVal > 1000 && current < 1000) displayStr = Math.round(current); 
    el.innerText = displayStr;
    el.style.color = getDynamicColor(current, min, max);

    if (progress < 1) requestAnimationFrame(update);
    else {
      el.innerText = targetVal > 1000 ? targetVal.toLocaleString() : targetVal;
      el.style.color = getDynamicColor(targetVal, min, max);
    }
  }
  requestAnimationFrame(update);
}

/* ============ 点击数字编辑功能 ============ */
function makeEditable(displayEl, sliderEl, min, max, isMesh) {
  displayEl.addEventListener('click', function() {
    if (this.tagName === 'INPUT') return;
    
    const rawValue = this.innerText.replace(/,/g, '');
    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.className = 'inline-input';
    input.value = rawValue;
    
    this.parentNode.replaceChild(input, this);
    input.focus();
    input.select();

    const commit = () => {
      let val = parseFloat(input.value.replace(/,/g, ''));
      if (isNaN(val)) val = parseFloat(sliderEl.value);
      if (val < min) val = min;
      if (val > max) val = max;
      
      sliderEl.value = val;
      sliderEl.dispatchEvent(new Event('input'));
      
      const span = document.createElement('span');
      span.id = displayEl.id;
      span.className = 'slider-value';
      span.innerText = val > 1000 ? val.toLocaleString() : val;
      span.style.color = getDynamicColor(val, min, max);
      
      input.parentNode.replaceChild(span, input);
      makeEditable(span, sliderEl, min, max, isMesh);
    };

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
  });
}

makeEditable(capDisplay, capSlider, 10, 10000, false);
makeEditable(sizeDisplay, sizeSlider, 1, 500, false);

/* ============ 基础交互 ============ */
capSlider.addEventListener('input', (e) => {
  targetCap = parseFloat(e.target.value);
  const el = document.getElementById('capDisplay') || document.querySelector('.inline-input');
  if(el && el.tagName !== 'INPUT') animateNumber(el, targetCap, 10, 10000);

sizeSlider.addEventListener('input', (e) => {
  targetSizeUI = parseFloat(e.target.value);
  if (currentUnit === 'um') {
    actualSizeUm = targetSizeUI;
  } else {
    actualSizeUm = 15400 / targetSizeUI;
  }
  const el = document.getElementById('sizeDisplay') || document.querySelector('.inline-input');
  if(el && el.tagName !== 'INPUT') animateNumber(el, targetSizeUI, parseInt(sizeSlider.min), parseInt(sizeSlider.max));

unitSwitch.addEventListener('click', e => {

  currentUnit = btn.dataset.u;

  const span = document.querySelector('.inline-input') || sizeDisplay;
  if (span.tagName === 'INPUT') span.blur();

    sizeSlider.min = 1; sizeSlider.max = 500; sizeSlider.step = 1;
    targetSizeUI = Math.round(15400 / targetSizeUI) || 45;

    if(targetSizeUI < 1) targetSizeUI = 1;
    actualSizeUm = targetSizeUI;
    sizeTicks.innerHTML = `<span>1</span><span>100</span><span>300</span><span>500</span>`;
  } else {
    sizeUnitLabel.innerText = '目';
    sizeSlider.min = 30; sizeSlider.max = 1250; sizeSlider.step = 10;
    targetSizeUI = Math.round(15400 / targetSizeUI) || 325;
    if(targetSizeUI > 1250) targetSizeUI = 1250;
    if(targetSizeUI < 30) targetSizeUI = 30;
    actualSizeUm = 15400 / targetSizeUI;
    sizeTicks.innerHTML = `<span>30</span><span>400</span><span>800</span><span>1250</span>`;
  }
  
  sizeSlider.value = targetSizeUI;
  const newSpan = document.getElementById('sizeDisplay');
  if(newSpan) {
    newSpan.innerText = targetSizeUI;
    newSpan.style.color = getDynamicColor(targetSizeUI, parseInt(sizeSlider.min), parseInt(sizeSlider.max));

});

const segButtons = document.querySelectorAll('.unit-switch:not(#unitSwitch) button');
segButtons.forEach(btn => {

      }

});

/* ============ 核心算法 ============ */
function normD97(sizeUm, basis){
  if (basis === 'D50') return sizeUm * 2.5;
  if (basis === 'D90') return sizeUm * 1.4;
  if (basis === 'D99') return sizeUm * 1.1;
  if (basis === 'D100') return sizeUm * 0.6;
  return sizeUm;
}

function scoreSeries(s, d97, cap, attrs){
  const isHighHard = attrs.includes('hard') || attrs.includes('quartz');
  const isEx = attrs.includes('ex');

  if (s.cat === '机械磨' && isHighHard) return -1; 
  if (s.cat === '机械磨' && isEx) return -1;
  if (s.cat === '气流磨' && (attrs.includes('sticky') || attrs.includes('fib') || attrs.includes('wet'))) return -1;
  if (s.id === 'BALL' && cap < 200) return -1;
  if (d97 < s.d97[0] * 0.65) return -1;
  if (d97 > s.d97[1] * 2.2) return -1;

  let sc = 50;
  let minDiff = Infinity;
  let maxCap = 0;
  
  if (s.id === 'BALL') {
    maxCap = s.models[s.models.length - 1].cap[1];
    for (let i = 0; i < s.models.length; i++) {
      const m = s.models[i];
      if (cap >= m.cap[0] * 0.8 && cap <= m.cap[1]) { sc += 30; minDiff = 0; break; }
      const diff = cap < m.cap[0] ? (m.cap[0] - cap) / cap : (cap - m.cap[1]) / cap;
      if (diff < minDiff) { minDiff = diff; }
    }
  } else {
    maxCap = s.models[s.models.length - 1][2];
    for (let i = 0; i < s.models.length; i++) {
      const m = s.models[i];
      if (cap >= m[1] * 0.8 && cap <= m[2]) { sc += 30; minDiff = 0; break; }
      const diff = cap < m[1] ? (m[1] - cap) / cap : (cap - m[2]) / cap;
      if (diff < minDiff) { minDiff = diff; }
    }
  }

  if (minDiff > 2.0) sc -= 30; else if (minDiff > 0.5) sc -= 10;
  if (d97 >= s.d97[0] && d97 <= s.d97[1]) sc += 20;

  for (const a of attrs){
    if (s.good.includes(a)) sc += 15; 
    if (s.bad.includes(a))  sc -= 20; 
  }

  if (isHighHard && s.id === 'BALL') sc += 20;
  if (isEx && s.id === 'BALL') sc += 10;

  return sc;
}

function pickModel(s, cap){
  if (s.id === 'BALL') {
    for (const m of s.models){
      if (cap >= m.cap[0] * 0.8 && cap <= m.cap[1]) return { name: m.name, range: `${m.cap[0]}–${m.cap[1]}`, desc: m.desc };
    }
    let best = s.models[0], minD = Infinity;
    for (const m of s.models) {
       let d = cap < m.cap[0] ? m.cap[0] - cap : cap - m.cap[1];
       if (d < minD) { minD = d; best = m; }
    }
    return { name: best.name + (cap > best.cap[1] ? ' (需升级)' : ' (偏小)'), range: `${best.cap[0]}–${best.cap[1]}`, desc: best.desc };
  } else {
    for (const m of s.models){
      if (cap >= m[1] * 0.8 && cap <= m[2]) return { name: m[0], range: `${m[1]}–${m[2]}`, desc:'' };
    }
    let best = s.models[0], minD = Infinity;
    for (const m of s.models) {
       let d = cap < m[1] ? m[1] - cap : cap - m[2];
       if (d < minD) { minD = d; best = m; }
    }
    return { name: best[0] + (cap > best[2] ? ' (需升级)' : ' (偏小)'), range: `${best[1]}–${best[2]}`, desc:'' };
  }
}

/* ============ 结果渲染 ============ */
function render(list, ctx){
  if (!list.length){
    outEl.innerHTML = `
      <div class="card" style="padding: 0;">
        <div class="empty-state">
          <h3>未找到匹配机型</h3>
          <p>当前工艺组合超出常规物理界限。<br>建议联系工程师安排物料小试后定制专机。</p>
        </div>
      </div>`;
    return;
  }

  const main = list[0];
  const mm = pickModel(main.s, ctx.cap);
  const matName = matEl.value.trim();
  
  let matchPct = Math.min(99, Math.round(main.sc * 0.75)); 
  if (matchPct < 50) matchPct = 50; 

  let tagClass = 'tag-red';
  if (matchPct >= 80) tagClass = 'tag-green';
  else if (matchPct >= 60) tagClass = 'tag-yellow';

  let warningHtml = '';
  if (ctx.attrs.includes('quartz') || ctx.attrs.includes('hard')) {
    warningHtml += `<div class="res-warn"><b>工程师警告：</b><br>物料磨蚀性极强，严禁使用普通钢衬板。<br>推荐配置：<b>高铬合金耐磨衬板 + 高铬钢球 + 管道除铁器</b>。</div>`;
  }
  if (ctx.attrs.includes('ex')) {
    warningHtml += `<div class="res-warn"><b>防爆强制要求：</b><br>物料具有易燃易爆属性，系统必须配备<b>防爆电机、全密闭惰性气体（氮气）循环、静电接地及在线氧含量监测</b>。</div>`;
  }

  let html = `
    <div class="res-header">智能匹配结果</div>
    <div class="card">
      <div class="result-tag ${tagClass}">${matchPct}%</div>
      <div class="card-body" style="padding-top: 24px;">
        <div class="res-main-title">${main.s.name}</div>
        <div class="res-sub-title">${main.s.sub}${matName ? ' · ' + matName : ''}</div>
        
        <div class="res-grid">
          <div class="res-item"><span>推荐配置</span><b>${mm.name}</b></div>
          <div class="res-item"><span>产能范围</span><b>${mm.range} kg/h</b></div>
          <div class="res-item"><span>可达粒度</span><b>D97 ${main.s.d97[0]}–${main.s.d97[1]} µm</b></div>
          <div class="res-item"><span>工艺类型</span><b>${main.s.cat}</b></div>
        </div>
        
        ${warningHtml}
        ${main.s.opt ? `<div class="res-opt"><b>推荐选配项</b><br>${main.s.opt.join(' · ')}</div>` : ''}
      </div>
    </div>`;

  outEl.innerHTML = html;
}

function evaluate(){
  if (!(actualSizeUm > 0)){
    outEl.innerHTML = `<div class="card" style="padding: 0;"><div class="empty-state"><h3>参数异常</h3><p>请检查粒度滑动条。</p></div></div>`;
    return;
  }

  const d97 = normD97(actualSizeUm, basis);
  const attrs = [...chipsEl.querySelectorAll('.switch-row.on')].map(row => row.dataset.k);

  const scored = [];
  for (const s of DB){
    const sc = scoreSeries(s, d97, targetCap, attrs);
    if (sc > 0) scored.push({ s, sc });
  }
  
  scored.sort((a, b) => b.sc - a.sc);
  render(scored.slice(0, 1), { cap: targetCap, d97, attrs });
}

$('go').addEventListener('click', evaluate);
