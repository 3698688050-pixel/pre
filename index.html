<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="粉体选型">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000" media="(prefers-color-scheme:dark)">
<title>粉体设备高级预选型</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#fff; --text:#000; --sub:#8a8a8e;
    --line:rgba(60,60,67,.12); --accent:#007aff; --danger:#ff3b30;
    --fill:rgba(120,120,128,.12); --warn-bg:rgba(255,149,0,.15); --warn-text:#ff9500;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000; --card:#1c1c1e; --text:#fff; --sub:#8e8e93;
      --line:rgba(255,255,255,.13); --accent:#0a84ff; --danger:#ff453a;
      --fill:rgba(120,120,128,.24); --warn-bg:rgba(255,159,10,.2); --warn-text:#ff9f0a;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 40px);
  }
  .wrap{max-width:520px;margin:0 auto;}

  .hd{padding:0 4px 18px;}
  .hd h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.02em;}
  .hd p{margin:6px 0 0;font-size:13px;font-weight:500;color:var(--sub);}

  .card{
    background:var(--card); border-radius:18px; overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.05);
    margin-bottom:14px;
  }
  @media (prefers-color-scheme:dark){ .card{box-shadow:none;} }

  .row{padding:13px 18px;}
  .row + .row{border-top:1px solid var(--line);}
  .lbl{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px;}
  .lbl em{font-style:normal;font-size:11px;font-weight:400;}
  .row input, .row select{
    display:block;width:100%;padding:4px 0;border:0;outline:0;background:transparent;
    color:var(--text);font-family:inherit;font-size:17px;font-weight:600;
    -webkit-appearance:none;appearance:none;
  }
  .row input::placeholder{color:var(--sub);opacity:.4;font-weight:500;}
  .row select{cursor:pointer;}
  .row select option{background:var(--card);color:var(--text);}

  /* 复合配方组件 */
  .mix-list { padding: 4px 18px 14px; }
  .mix-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .mix-item input[type="text"] { flex: 2; background: var(--fill); padding: 10px; border-radius: 8px; font-size: 14px; border: 0; outline: 0; color: var(--text); }
  .mix-item input[type="number"] { flex: 1; background: var(--fill); padding: 10px; border-radius: 8px; font-size: 14px; border: 0; outline: 0; color: var(--text); text-align: center; }
  .mix-item button { background: transparent; border: 0; color: var(--danger); font-size: 18px; font-weight: bold; padding: 0 8px; cursor: pointer; }
  .mix-add { padding: 0 18px 14px; }
  .mix-add button { width: 100%; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; background: transparent; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }
  .mix-total { padding: 0 18px 14px; font-size: 12px; font-weight: 600; text-align: right; color: var(--sub); }
  .mix-total.warn { color: var(--danger); }

  .seg{display:flex;gap:4px;padding:0 18px 16px;}
  .seg button{
    flex:1;padding:9px 0;border:0;border-radius:9px;background:var(--fill);
    color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .seg button.on{background:var(--accent);color:#fff;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 18px 18px;}
  .chip{
    padding:8px 12px;border-radius:10px;border:0;background:var(--fill);
    color:var(--text);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .chip.on{background:var(--accent);color:#fff;}

  .go{
    display:block;width:100%;padding:17px;border:0;border-radius:16px;
    background:var(--accent);color:#fff;font-family:inherit;
    font-size:17px;font-weight:700;letter-spacing:.01em;cursor:pointer;
    margin:4px 0 22px;
  }
  .go:active{opacity:.82;}

  .res-head{
    display:flex;align-items:center;gap:8px;padding:0 4px 10px;
    font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em;
  }
  .main{padding:20px 18px 18px;}
  .badge{
    display:inline-block;padding:4px 9px;border-radius:7px;
    background:color-mix(in srgb, var(--accent) 15%, transparent);
    color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.04em;
    margin-bottom:10px;
  }
  .main h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;}
  .main .sub{margin:5px 0 16px;font-size:13px;font-weight:500;color:var(--sub);}
  
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;}
  .grid > div{min-width:0;}
  .grid span{display:block;font-size:11px;font-weight:600;color:var(--sub);letter-spacing:.04em;margin-bottom:3px;}
  .grid b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;}
  
  .warn{
    margin:16px 0 0; padding:12px; border-radius:10px;
    background:var(--warn-bg); color:var(--warn-text);
    font-size:13px; font-weight:500; line-height:1.5;
  }

  .alt{padding:15px 18px;}
  .alt + .alt{border-top:1px solid var(--line);}
  .alt h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .alt p{margin:4px 0 0;font-size:13px;color:var(--sub);font-weight:500;}
  .alt .kv{margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums;}
  .alt .kv span{color:var(--sub);}
  .alt .kv b{font-weight:600;}

  .empty{padding:26px 18px;text-align:center;}
  .empty h3{margin:0 0 6px;font-size:17px;font-weight:600;}
  .empty p{margin:0;font-size:13px;color:var(--sub);line-height:1.6;}

  .tip{margin-top:16px;padding:0 4px;font-size:12px;color:var(--sub);line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">

  <header class="hd">
    <h1>粉体设备预选型</h1>
    <p>复合配方加权算法 · 产能防呆</p>
  </header>

  <!-- 复合配方部分 -->
  <section class="card">
    <div class="row" style="padding-bottom:4px;">
      <label class="lbl">物料成分及占比 <em>输入单个物料或混合配方</em></label>
    </div>
    <div class="mix-list" id="mixList">
      <!-- 动态生成 -->
    </div>
    <div class="mix-add">
      <button id="addMixBtn">+ 添加成分</button>
    </div>
    <div class="mix-total" id="mixTotal">总计：100%</div>
    
    <div class="row">
      <label class="lbl">目标产能（kg/h）</label>
      <input id="cap" type="text" inputmode="decimal" placeholder="如 150" autocomplete="off">
    </div>
  </section>

  <!-- 粒度要求 -->
  <section class="card">
    <div class="row">
      <label class="lbl">目标粒度（µm） <em>支持范围：如 10-20</em></label>
      <input id="size" type="text" inputmode="text" placeholder="如 74" autocomplete="off">
    </div>
    <div class="seg" id="seg">
      <button data-v="D50" class="on">D50</button>
      <button data-v="D90">D90</button>
      <button data-v="D97">D97</button>
      <button data-v="D99">D99</button>
      <button data-v="D100">D100</button>
    </div>
  </section>

  <!-- 工艺及物料特性（当只有一种成分时，可手动微调） -->
  <section class="card" id="attrCard">
    <div class="row">
      <label class="lbl">补充要求（选填）</label>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-k="easy">易磨（功指数低）</button>
      <button class="chip" data-k="hard">莫氏硬度 &gt; 5</button>
      <button class="chip" data-k="wet">含水率 &gt; 5%</button>
      <button class="chip" data-k="fib">纤维状 / 高韧性</button>
      <button class="chip" data-k="sticky">粘性强 / 易糊壁</button>
      <button class="chip" data-k="heat">热敏 / 低熔点</button>
      <button class="chip" data-k="ex" style="color:var(--danger)">易燃易爆</button>
      <button class="chip" data-k="gmp">医药 / 食品 GMP</button>
    </div>
  </section>

  <button class="go" id="go">开始综合评估</button>
  <div id="out"></div>

  <p class="tip">复合配方算法会根据各成分的理化属性进行加权计算，综合评判设备大类。单个成分占比低于10%时，其极端属性（如极高硬度）权重会被稀释。</p>
</div>

<script>
/* ============ 内置物料知识库 ============ */
const MATERIAL_DB = {
  "无定形二氧化硅": { cat: "mineral", attrs: ["easy"] },
  "石英": { cat: "hard", attrs: ["hard", "quartz"] },
  "高岭土": { cat: "mineral", attrs: ["sticky", "easy"] },
  "碳酸钙": { cat: "mineral", attrs: ["easy"] },
  "滑石": { cat: "mineral", attrs: ["easy", "sticky"] },
  "石墨": { cat: "mineral", attrs: ["easy", "pure"] },
  "云母": { cat: "mineral", attrs: ["fib"] },
  "钢渣": { cat: "waste", attrs: ["hard", "wet"] },
  "粉煤灰": { cat: "waste", attrs: ["wet"] },
  "混凝土": { cat: "waste", attrs: ["hard", "quartz", "wet"] },
  
  "甘草": { cat: "herb", attrs: ["fib", "heat"] },
  "三七": { cat: "herb", attrs: ["fib"] },
  "中药": { cat: "herb", attrs: ["fib"] },
  
  "阿莫西林": { cat: "pharma", attrs: ["gmp", "heat", "static"] },
  "布洛芬": { cat: "pharma", attrs: ["gmp", "heat"] },
  
  "三元材料": { cat: "battery", attrs: ["pure", "oxidation", "static"] },
  "磷酸铁锂": { cat: "battery", attrs: ["pure", "oxidation"] },
  
  "糖": { cat: "food", attrs: ["gmp", "sticky", "heat"] },
  "盐": { cat: "food", attrs: ["gmp", "wet"] },
  
  "氧化铝": { cat: "hard", attrs: ["hard", "pure"] },
  "碳化硅": { cat: "hard", attrs: ["hard", "pure", "quartz"] },
  
  "PVC": { cat: "chem", attrs: ["heat", "static"] },
  "PE": { cat: "chem", attrs: ["heat", "fib"] },
  "炭黑": { cat: "chem", attrs: ["pure", "static", "ex"] },
  
  "铝粉": { cat: "metal", attrs: ["oxidation", "ex", "pure"] }
};

/* ============ 设备库 ============ */
const DB = [
  {
    id:'CSMV', name:'CSM-V 空气分级磨', sub:'立式分级轮 · 软质精细磨',
    cat:'机械磨', d97:[5,115], good:['easy', 'flow'], bad:['hard','quartz','ex'],
    models:[['CSM280-V',60,150],['CSM350-V',120,280],['CSM410-V',180,380],['CSM510-V',260,520],['CSM710-V',400,760],['CSM760-V',450,850],['CSM900-V',700,1300],['CSM1000-V',850,1500],['CSM1100-V',1100,2000],['CSM1250-V',1500,2600],['CSM1500-V',2000,3400],['CSM2000-V',3000,5200]],
    opt:['陶瓷内衬','低温设计']
  },
  {
    id:'CUM', name:'CUM 针盘/锤式磨', sub:'风量大 · 粗碎打散',
    cat:'机械磨', d97:[25,600], good:['fib','sticky'], bad:['hard','ex'],
    models:[['CUM160',30,80],['CUM260',90,240],['CUM360',180,480],['CUM500',350,950],['CUM630',600,1600],['CUM800',950,2600],['CUM1000',1500,4000]],
    opt:['防爆设计']
  },
  {
    id:'MQW', name:'MQW 流化床式气流磨', sub:'干法超细 · 无温升',
    cat:'气流磨', d97:[3,45], good:['heat','ex','gmp'], bad:['sticky','wet','fib','easy'],
    models:[['MQW03',0.3,1],['MQW06',10,30],['MQW10',20,300],['MQW20',40,600],['MQW30',100,900],['MQW40',200,1200],['MQW60',500,2000]],
    opt:['氮气保护']
  },
  {
    id:'BALL', name:'球磨分级生产线', sub:'大规模 · 极硬物料兜底',
    cat:'球磨', d97:[3,45], good:['hard','wet','quartz'], bad:['heat','gmp','easy'],
    models:[
      { name:'IBM1570 + FL360', cap:[500, 2000], desc:'小产能' },
      { name:'IBM1830 + FL360', cap:[1000, 3000], desc:'1吨主力' },
      { name:'IBM2400 + FL600', cap:[4000, 8000], desc:'5吨主力' }
    ],
    opt:['高铬耐磨衬板']
  }
];

/* ============ 交互与 UI ============ */
const $ = id => document.getElementById(id);
const mixListEl = $('mixList'), mixTotalEl = $('mixTotal');
const capEl = $('cap'), sizeEl = $('size'), segEl = $('seg'), chipsEl = $('chips'), outEl = $('out');
let basis = 'D50'; 

// 生成 Datalist
const matListEl = document.createElement('datalist');
matListEl.id = 'matList';
Object.keys(MATERIAL_DB).forEach(k => {
  const opt = document.createElement('option');
  opt.value = k;
  matListEl.appendChild(opt);
});
document.body.appendChild(matListEl);

// 添加成分行
function createMixRow(name = '', pct = '') {
  const div = document.createElement('div');
  div.className = 'mix-item';
  div.innerHTML = `
    <input type="text" list="matList" placeholder="物料名称" value="${name}" autocomplete="off">
    <input type="number" placeholder="占比%" value="${pct}" min="1" max="100">
    <button type="button" title="删除">×</button>
  `;
  
  const nameInput = div.querySelector('input[type="text"]');
  const pctInput = div.querySelector('input[type="number"]');
  const delBtn = div.querySelector('button');

  // 输入物料名自动联想
  nameInput.addEventListener('input', () => {
    const info = MATERIAL_DB[nameInput.value.trim()];
    if (info) {
      [...chipsEl.children].forEach(b => {
        if(info.attrs.includes(b.dataset.k)) b.classList.add('on');
      });
    }
    calcTotal();
  });

  pctInput.addEventListener('input', calcTotal);
  
  delBtn.addEventListener('click', () => {
    div.remove();
    if(mixListEl.children.length === 0) createMixRow('', ''); // 至少留一行
    calcTotal();
  });

  mixListEl.appendChild(div);
  calcTotal();
}

// 计算总和
function calcTotal() {
  let total = 0;
  [...mixListEl.querySelectorAll('input[type="number"]')].forEach(inp => {
    total += parseFloat(inp.value) || 0;
  });
  mixTotalEl.textContent = `总计：${total}%`;
  mixTotalEl.className = 'mix-total ' + (total === 100 ? '' : 'warn');
}

$('addMixBtn').addEventListener('click', () => createMixRow('', ''));
createMixRow('', '100'); // 默认一行 100%

segEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  [...segEl.children].forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  basis = b.dataset.v;
});

chipsEl.addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if(!b) return;
  b.classList.toggle('on');
});

/* ============ 核心计算逻辑 ============ */
function parseSizeRange(str) {
  if (!str) return 0;
  const nums = str.match(/\d+(\.\d+)?/g);
  if (!nums) return 0;
  return nums.length >= 2 ? parseFloat(nums[1]) : parseFloat(nums[0]);
}

function normD97(size, basis){
  if (basis === 'D50') return size * 2.5;
  if (basis === 'D90') return size * 1.4;
  if (basis === 'D99') return size * 1.1;
  if (basis === 'D100') return size * 0.6;
  return size;
}

function evaluate(){
  const sizeRaw = parseSizeRange(sizeEl.value);
  if (!(sizeRaw > 0)){ outEl.innerHTML = `<div class="card"><div class="empty"><h3>请填写目标粒度</h3></div></div>`; return; }

  // 1. 收集复合配方
  const mixes = [];
  let totalPct = 0;
  [...mixListEl.querySelectorAll('.mix-item')].forEach(item => {
    const name = item.querySelector('input[type="text"]').value.trim();
    const pct = parseFloat(item.querySelector('input[type="number"]').value) || 0;
    if (name && pct > 0) {
      const dbInfo = MATERIAL_DB[name] || { cat: 'other', attrs: [] };
      mixes.push({ name, pct, attrs: dbInfo.attrs });
      totalPct += pct;
    }
  });

  if (totalPct !== 100) {
    outEl.innerHTML = `<div class="card"><div class="empty"><h3>配比总和必须为 100%</h3><p>当前总计 ${totalPct}%，请调整成分比例后再试。</p></div></div>`;
    return;
  }

  // 2. 综合加权计算属性
  const scoreMap = {};
  mixes.forEach(m => {
    m.attrs.forEach(attr => {
      scoreMap[attr] = (scoreMap[attr] || 0) + m.pct;
    });
  });
  
  // 补充手动勾选的属性（如果用户勾了，权重直接拉满为 100）
  const manualAttrs = [...chipsEl.querySelectorAll('.chip.on')].map(b => b.dataset.k);
  manualAttrs.forEach(a => scoreMap[a] = 100);

  // 3. 转换加权结果（设定阈值）
  const finalAttrs = [];
  if (scoreMap['easy'] > 30) finalAttrs.push('easy');
  if (scoreMap['hard'] > 15) finalAttrs.push('hard'); // 硬质只要占比超15%就不能忽视
  if (scoreMap['quartz'] > 15) finalAttrs.push('quartz');
  if (scoreMap['wet'] > 20) finalAttrs.push('wet');
  if (scoreMap['sticky'] > 20) finalAttrs.push('sticky');
  if (scoreMap['fib'] > 20) finalAttrs.push('fib');
  if (scoreMap['heat'] > 20) finalAttrs.push('heat');
  if (scoreMap['ex'] > 5) finalAttrs.push('ex'); // 易爆只要有一点点，就必须防爆
  if (scoreMap['gmp'] > 20) finalAttrs.push('gmp');

  const cap = parseFloat(capEl.value) || 150; 
  const d97 = normD97(sizeRaw, basis);

  // 4. 打分排序
  const scored = [];
  for (const s of DB){
    const sc = scoreSeries(s, d97, cap, finalAttrs, scoreMap);
    if (sc > 0) scored.push({ s, sc });
  }
  scored.sort((a, b) => b.sc - a.sc);

  render(scored.slice(0, 3), { cap, d97, finalAttrs, mixes, sizeText: `${basis} ${sizeEl.value} µm` });
}

function scoreSeries(s, d97, cap, attrs, scoreMap){
  const isHighHard = attrs.includes('hard');
  const isEx = attrs.includes('ex');

  // 互斥绝对逻辑
  if (s.cat === '机械磨' && isHighHard) return -1;
  if (s.cat === '机械磨' && isEx) return -1;
  if (s.cat === '气流磨' && (attrs.includes('sticky') || attrs.includes('fib') || attrs.includes('wet') || attrs.includes('easy'))) return -1;
  if (s.id === 'BALL' && cap < 200) return -1;
  if (d97 < s.d97[0] * 0.65 || d97 > s.d97[1] * 2.2) return -1;

  let sc = 0;
  let minDiff = Infinity;
  
  // 产能匹配
  if (s.id === 'BALL') {
    for (let i = 0; i < s.models.length; i++) {
      const m = s.models[i];
      if (cap >= m.cap[0] * 0.8 && cap <= m.cap[1]) { sc += 80; minDiff = 0; break; }
      const diff = cap < m.cap[0] ? (m.cap[0] - cap) / cap : (cap - m.cap[1]) / cap;
      if (diff < minDiff) { minDiff = diff; }
    }
  } else {
    for (let i = 0; i < s.models.length; i++) {
      const m = s.models[i];
      if (cap >= m[1] * 0.8 && cap <= m[2] * 1.15) { sc += 80; minDiff = 0; break; }
      const diff = cap < m[1] ? (m[1] - cap) / cap : (cap - m[2]) / cap;
      if (diff < minDiff) { minDiff = diff; }
    }
  }

  if (minDiff > 2.0) sc -= 150; 
  else if (minDiff > 0.5) sc -= 40;

  // 粒度打分
  if (d97 >= s.d97[0] && d97 <= s.d97[1]) sc += 60;
  else if (d97 < s.d97[0]) sc += 15;

  // 属性打分 (利用 scoreMap 的百分比进行加成/惩罚)
  for (const a of attrs){
    if (s.good.includes(a)) sc += 25; 
    if (s.bad.includes(a))  sc -= 50;
  }

  // 特殊强推逻辑
  if (scoreMap['easy'] > 50 && s.id === 'CSMV') sc += 30;
  if (scoreMap['hard'] > 50 && s.id === 'BALL') sc += 40;

  return sc;
}

function pickModel(s, cap){
  if (s.id === 'BALL') {
    for (const m of s.models) {
      if (cap >= m.cap[0] * 0.8 && cap <= m.cap[1] * 1.15) return { name: m.name, range: `${m.cap[0]}–${m.cap[1]} kg/h`, desc: m.desc };
    }
    return { name: s.models[0].name, range: `${s.models[0].cap[0]}–${s.models[0].cap[1]} kg/h`, desc: s.models[0].desc };
  } else {
    for (const m of s.models){
      if (cap >= m[1] * 0.8 && cap <= m[2] * 1.15) return { name: m[0], range: `${m[1]}–${m[2]} kg/h`, desc:'' };
    }
    let best = s.models[0], minD = Infinity;
    for (const m of s.models) {
       let d = cap < m[1] ? m[1] - cap : cap - m[2];
       if (d < minD) { minD = d; best = m; }
    }
    return { name: best[0], range: `${best[1]}–${best[2]} kg/h`, desc:'' };
  }
}

function render(list, ctx){
  if (!list.length){
    outEl.innerHTML = `<div class="card"><div class="empty"><h3>无匹配机型</h3><p>参数存在严重互斥或超出标准机型范围，请联系工程师。</p></div></div>`;
    return;
  }

  const main = list[0];
  const mm = pickModel(main.s, ctx.cap);
  const mixStr = ctx.mixes.map(m => `${m.name} ${m.pct}%`).join(' + ');
  
  let warningHtml = '';
  if (ctx.finalAttrs.includes('ex')) {
    warningHtml += `<div class="warn" style="background:rgba(255,59,48,.15);color:var(--danger);"><b>💥 防爆要求：</b>混合配方中含易爆成分，必须配备防爆电机与惰性气体循环。</div>`;
  }
  if (ctx.finalAttrs.includes('hard') && !ctx.finalAttrs.includes('easy')) {
    warningHtml += `<div class="warn"><b>⚠️ 耐磨警告：</b>配方中硬质成分占比偏高，建议采用高铬耐磨配置。</div>`;
  }

  let html = `
    <div class="res-head">评估结果 · ${ctx.sizeText} · ${ctx.cap} kg/h</div>
    <div class="card">
      <div class="main">
        <div class="badge">主推方案</div>
        <h2>${main.s.name}</h2>
        <p class="sub" style="line-height: 1.4; word-break: break-all;">配方：${mixStr}</p>
        <div class="grid" style="margin-top:12px;">
          <div><span>推荐配置</span><b>${mm.name}</b></div>
          <div><span>产能范围</span><b>${mm.range}</b></div>
          <div><span>可达粒度</span><b>D97 ${main.s.d97[0]}–${main.s.d97[1]} µm</b></div>
          <div><span>工艺类型</span><b>${main.s.cat}</b></div>
        </div>
        ${warningHtml}
      </div>
    </div>`;

  const alts = list.slice(1);
  if (alts.length){
    html += `<div class="res-head">备选方案</div><div class="card">`;
    for (const a of alts){
      const am = pickModel(a.s, ctx.cap);
      html += `
        <div class="alt">
          <h3>${a.s.name}</h3>
          <p>${a.s.sub}</p>
          <div class="kv">
            <div><span>型号 </span><b>${am.name}</b></div>
            <div><span>产能 </span><b>${am.range}</b></div>
            <div><span>粒度 </span><b>D97 ${a.s.d97[0]}–${a.s.d97[1]} µm</b></div>
          </div>
        </div>`;
    }
    html += `</div>`;
  }
  outEl.innerHTML = html;
}

$('go').addEventListener('click', evaluate);
</script>
</body>
</html>
